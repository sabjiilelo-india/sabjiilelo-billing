databases:
  - name: thermal-billing-db
    plan: free
    databaseName: thermal_billing

services:
  - type: web
    name: thermal-billing
    runtime: node
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: thermal-billing-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
