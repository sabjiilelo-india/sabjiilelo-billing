services:
  - type: web
    name: sabjiilelo-billing
    runtime: node
    region: singapore # keep next to the Neon database (ap-southeast-1)
    plan: free
    # --include=dev: TypeScript and Tailwind are devDependencies but are needed by `next build`.
    buildCommand: npm ci --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # paste your Neon connection string in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true
